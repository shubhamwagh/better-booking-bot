[project]
name = "better-booking-bot"
version = "1.0.5"
description = "Automated activity booking bot for Better (GLL) leisure centres."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.2",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "playwright>=1.60.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "tzdata>=2025.2",
    "uvicorn>=0.34.0",
]

[project.scripts]
better-bot = "better_bot.bot:main"
better-bot-daemon = "better_bot.daemon:main"
better-bot-webui = "better_bot.webui:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
    "ruff>=0.16.2",
    "ty>=0.0.70",
]

[tool.hatch.build.targets.wheel]
packages = ["src/better_bot"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Form(...)/Depends(...) as a default argument is the intended pattern
]

[tool.ruff.lint.per-file-ignores]
"src/better_bot/webui.py" = ["E501"]  # inline HTML/CSS/JS template strings
"src/better_bot/checkout.py" = ["E501"]  # inline JS snippets passed to page.evaluate
"tests/*" = ["E501"]

[tool.coverage.run]
source = ["src/better_bot"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
